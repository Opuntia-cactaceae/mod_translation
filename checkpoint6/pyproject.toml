[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translator_benchmark"
version = "0.1.0"
description = "Benchmark system for comparing LLMs, prompts, protection strategies, and validation strategies — plus the translator_app package for the local web application"
readme = "README.md"
authors = [{ name = "Developer", email = "dev@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "sacrebleu>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

comet = [
    "unbabel-comet>=2.0.0",
]

token = [
    "tiktoken>=0.5.0",
]

[project.urls]
Repository = "https://github.com/user/translator_benchmark"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
